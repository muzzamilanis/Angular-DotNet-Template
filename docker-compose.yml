version: '3.8'

services:
  api:
    build:
      context: ./Backend/AspNetCore/SimpleApi
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=BusinessDB;Username=postgres;Password=postgres
      - Jwt__Key=your-secret-key-must-be-at-least-256-bits-long-for-security-in-production-environment
      - Jwt__Issuer=SimpleApi
      - Jwt__Audience=SimpleApi
      # Email configuration (optional - set your own values)
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__Username=
      - Email__Password=
      - Email__FromEmail=
      - Email__FromName=SmartBizApp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=BusinessDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge