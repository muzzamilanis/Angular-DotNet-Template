name: Keep Render API Alive

on:
  schedule:
    - cron: "*/1 * * * *"   # Run every 1 minute
  workflow_dispatch:        # Allow manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call API health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://angular-dotnet-template.onrender.com/api/Health/ping
