name: Main CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          backend:
            - 'Backend/**'
            - '.github/workflows/backend-ci.yml'
            - '.github/workflows/main-ci.yml'
          frontend:
            - 'FrontEnd/**'
            - '.github/workflows/frontend-ci.yml'
            - '.github/workflows/main-ci.yml'
          mobile:
            - 'Mobile/**'
            - '.github/workflows/mobile-ci.yml'
            - '.github/workflows/main-ci.yml'
          docker:
            - 'docker-compose.yml'
            - 'Backend/**/Dockerfile'
            - 'FrontEnd/**/Dockerfile'
            - '.github/workflows/integration.yml'
            - '.github/workflows/main-ci.yml'

  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  mobile-ci:
    name: Mobile CI
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-ci.yml

  integration:
    name: Integration Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true' || needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/integration.yml

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-ci, frontend-ci, mobile-ci, integration]
    if: always()
    steps:
    - name: Check results
      run: |
        echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Component Status:" >> $GITHUB_STEP_SUMMARY
        echo "- Backend: ${{ needs.backend-ci.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend: ${{ needs.frontend-ci.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Mobile: ${{ needs.mobile-ci.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration: ${{ needs.integration.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.backend-ci.result }}" == "failure" ]] || \
           [[ "${{ needs.frontend-ci.result }}" == "failure" ]] || \
           [[ "${{ needs.mobile-ci.result }}" == "failure" ]] || \
           [[ "${{ needs.integration.result }}" == "failure" ]]; then
          echo "❌ Pipeline failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ Pipeline succeeded" >> $GITHUB_STEP_SUMMARY
        fi
