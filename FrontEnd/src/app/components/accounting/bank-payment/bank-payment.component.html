<div class="row">
    <div class="col-md-12">
        <div class="card card-info">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-university mr-2"></i>
                    Bank Payment Voucher
                </h3>
            </div>
            <form [formGroup]="voucherForm" (ngSubmit)="onSubmit()">
                <div class="card-body">
                    <!-- Voucher Header -->
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="voucherNumber">Voucher Number *</label>
                                <input type="text" class="form-control" id="voucherNumber" 
                                       formControlName="voucherNumber" placeholder="BP-001">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="voucherDate">Payment Date *</label>
                                <input type="date" class="form-control" id="voucherDate" 
                                       formControlName="voucherDate">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="chequeNumber">Cheque Number</label>
                                <input type="text" class="form-control" id="chequeNumber" 
                                       formControlName="chequeNumber" placeholder="Optional">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="referenceNumber">Reference Number</label>
                                <input type="text" class="form-control" id="referenceNumber" 
                                       formControlName="referenceNumber" placeholder="Optional">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="description">Description</label>
                                <textarea class="form-control" id="description" 
                                          formControlName="description" rows="2" 
                                          placeholder="Enter payment description"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Details -->
                    <h5 class="mt-3 mb-3">
                        <i class="fas fa-dollar-sign mr-2"></i>
                        Payment Details
                    </h5>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="bankAccountId">Bank Account *</label>
                                <select class="form-control" id="bankAccountId" formControlName="bankAccountId">
                                    <option [value]="null">Select Bank Account</option>
                                    <option *ngFor="let account of bankAccounts" [value]="account.id">
                                        {{ account.accountCode }} - {{ account.accountName }}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="paymentToAccountId">Payment To Account *</label>
                                <select class="form-control" id="paymentToAccountId" formControlName="paymentToAccountId">
                                    <option [value]="null">Select Account</option>
                                    <option *ngFor="let account of accounts" [value]="account.id">
                                        {{ account.accountCode }} - {{ account.accountName }}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="amount">Amount *</label>
                                <input type="number" class="form-control" id="amount" 
                                       formControlName="amount" placeholder="0.00" step="0.01" min="0">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="narration">Narration</label>
                                <input type="text" class="form-control" id="narration" 
                                       formControlName="narration" placeholder="Payment purpose">
                            </div>
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <h6>Transaction Summary:</h6>
                                    <p class="mb-1">
                                        <strong>Debit:</strong> Payment To Account - 
                                        ${{ voucherForm.get('amount')?.value | number:'1.2-2' }}
                                    </p>
                                    <p class="mb-0">
                                        <strong>Credit:</strong> Bank Account - 
                                        ${{ voucherForm.get('amount')?.value | number:'1.2-2' }}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-footer">
                    <button type="submit" class="btn btn-info" 
                            [disabled]="voucherForm.invalid || loading">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-2"></span>
                        <i class="fas fa-save mr-2"></i>
                        Save Bank Payment
                    </button>
                    <button type="button" class="btn btn-secondary ml-2" (click)="resetForm()">
                        <i class="fas fa-times mr-2"></i>
                        Reset
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
